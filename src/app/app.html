<!-- Offline Banner -->
<app-offline-banner />

<!-- PWA Prompt -->
<app-pwa-prompt />

<!-- App is now just a shell for features -->
@if (authService.isAuthenticated()) {
  @if (currentPage() === 'projects') {
    <app-projects (projectSelected)="navigateToDiary($event)"></app-projects>
  } @else if (currentPage() === 'diary') {
    <app-diary (backToProjects)="navigateToProjects()" (goToDailyReport)="navigateToDailyReport()"></app-diary>
  } @else if (currentPage() === 'daily-report') {
    <app-daily-report (backToDiary)="currentPage.set('diary')" (backToProjects)="navigateToProjects()"></app-daily-report>
  }
} @else {
  <app-login></app-login>
}
